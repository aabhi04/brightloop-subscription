{% if msg %}
  <div class="no-print mb-4 rounded-md bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 text-sm">{{ msg }}</div>
{% endif %}
{% if err %}
  <div class="no-print mb-4 rounded-md bg-red-50 border border-red-200 text-red-800 px-4 py-3 text-sm">{{ err }}</div>
{% endif %}
