{# Live checklist; app.js ticks items as the user types. Labels come from app/validators/password.py #}
<ul data-password-checklist class="text-sm space-y-1">
  {% for key, label in password_rules %}
    <li data-rule="{{ key }}" class="text-slate-400"><span>○</span> {{ label }}</li>
  {% endfor %}
</ul>
