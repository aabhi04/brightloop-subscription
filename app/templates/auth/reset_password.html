{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth_content %}
<h2 class="text-lg font-semibold mb-4">Choose a new password</h2>
<form method="post" action="/reset-password/{{ token }}" class="space-y-4">
  <label class="block text-sm">
    <span class="text-slate-600">New password</span>
    <input type="password" name="password" required data-password-rules autocomplete="new-password"
           class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2">
  </label>
  {% include "auth/password_checklist.html" %}
  <button type="submit" class="w-full px-4 py-2 rounded-md bg-slate-900 text-white">Update password</button>
</form>
{% endblock %}
